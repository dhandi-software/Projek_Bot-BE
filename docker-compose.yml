version: '3.8'

# Memberikan nama project agar rapi (grup) di Docker Desktop
name: projek_bot

services:
  backend:
    build: .
    container_name: projek_bot_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json
      - ./.env:/app/.env
    environment:
      - REDIS_URL=redis:6379
      - DB_HOST=host.docker.internal
      - DB_USER=postgres
      - DB_PASSWORD=your_db_password
      - DB_NAME=your_db_name
      - DB_PORT=5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    tty: true

  frontend:
    build: ../Bot_FE
    container_name: projek_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: projek_bot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
